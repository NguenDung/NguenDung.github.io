<head>
  <!-- Basics -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  {%- seo -%}
  {%- feed_meta -%}

  <!-- JSON-LD BlogPosting only on posts -->
  {%- if page.date -%}{%- include jsonld-post.html -%}{%- endif -%}

  <!-- Perf hints for external CDNs used -->
  <link rel="dns-prefetch" href="//code.jquery.com">
  <link rel="preconnect" href="https://code.jquery.com" crossorigin>
  <link rel="dns-prefetch" href="//giscus.app">
  <link rel="preconnect" href="https://giscus.app" crossorigin>
  <link rel="dns-prefetch" href="//gc.zgo.at">
  <link rel="preconnect" href="https://gc.zgo.at" crossorigin>

  <!-- Theme CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/magnific-popup.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/mobile.css' | relative_url }}">

  <!-- Icons / PWA -->
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/icon-192.png' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#0b0f19">

  <!-- Analytics -->
  {%- include analytics.html -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- jQuery + popup -->
  <script defer src="https://code.jquery.com/jquery-3.2.0.min.js"></script>
  <script defer src="{{ '/assets/js/jquery.magnific-popup.js' | relative_url }}"></script>

  <!-- Enhancements -->
  <script defer src="{{ '/assets/js/lazy-img.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/ux-mobile.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>

  <!-- PWA SW register -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}');
      });
    }
  </script>
</head>
