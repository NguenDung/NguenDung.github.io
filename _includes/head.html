<head>
  <!-- Basics -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- seo -%}
  {%- feed_meta -%}

  <!-- JSON-LD BlogPosting only on posts -->
  {%- if page.date -%}{%- include jsonld-post.html -%}{%- endif -%}

  <!-- Theme CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/magnific-popup.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}" />

  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  {%- include analytics.html -%}

  <!-- jQuery + popup -->
  <script src="https://code.jquery.com/jquery-3.2.0.min.js"></script>
  <script src="{{ '/assets/js/jquery.magnific-popup.js' | relative_url }}"></script>

  <!-- Single bundled enhancement script -->
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
</head>
