# ---- Site basics ----
title: SuiiKawaii
author: SuiiKawaii
description: >-
  Part time CTF Player learn every day!!
  <br/>🌠 I Love Hoshimachi Suisei!!  🌠
  <br/>🌠 I Love Hoshimachi Suisei!! 🌠
show_excerpts: false

paginate: 10
paginate_path: "/blog/page:num/"

# ---- URLs ----
# User/Org site => baseurl must be empty
url: "https://nguendung.github.io"
baseurl: ""

# ---- Theme ----
# Using local layouts/assets (no remote theme)
# remote_theme: jekyll-dash

# ---- Plugins ----
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - liquid-md5
  - jekyll/tagging
  # - jekyll-archives   # disabled to avoid duplicate tag pages

# ---- jekyll-tagging config ----
tag_permalink_style: pretty     # /tag/<slug>/
tag_page_layout: tag_page       # your tag layout in _layouts
tag_page_dir: tag               # output to /tag/

# ---- dash theme options (safe to keep even without remote theme) ----
dash:
  date_format: "%b %-d, %Y"
  social_links:
    - url: https://x.com/Suii_cute
      icon: twitter-square
      color: cyan
    - url: https://www.facebook.com/SuiiKawaii/
      icon: facebook-square
      color: blue
    - url: https://github.com/NguenDung
      icon: github-square
      color: purple
  show_author: true
  animation_speed: 50
  rtl: false
  avatar_source: local
  avatar_path: /assets/ringo.gif

# ---- Build hygiene ----
exclude:
  - vendor
  - node_modules
  - README.md
  - .gitignore
  - .github

timezone: Asia/Ho_Chi_Minh
future: true

# ---- Defaults: comments only on posts ----
defaults:
  - scope:
      path: ""        # all paths
      type: "posts"   # only blog posts
    values:
      layout: post-with-comments
      comments: true  # you can disable per post with: comments: false

# ---- Comments (Giscus) ----
giscus:
  repo: "NguenDung/NguenDung.github.io"
  repo_id: "R_kgDOPYNL4w"
  category: "General"
  category_id: "DIC_kwDOPYNL484CuPwb"
  mapping: "pathname"
  reactions: "1"
  input_position: "bottom"
  theme: "preferred_color_scheme"
  lang: "en"


# ---- Analytics (optional) ----
analytics:
  plausible_domain: "nguendung.github.io"
  umami_website_id: ""          # e.g. UUID
  umami_src: ""                 # e.g. https://umami.example.com/script.js
